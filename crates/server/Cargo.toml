[package]
name = "emusic-server"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Hardened homelab music server for the emusic desktop client"

[lib]
name = "emusic_server"
path = "src/lib.rs"

[[bin]]
name = "emusic-server"
path = "src/main.rs"

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["ws", "macros"] }
axum-server = { version = "0.8", features = ["tls-rustls"] }
clap = { version = "4", features = ["derive"] }
emusic-core = { path = "../core" }
hex = "0.4"
ipnet = "2"
lofty = "0.25"
md-5 = "0.10"
pasetors = "0.8"
r2d2 = "0.8"
r2d2_sqlite = "0.25"
rand = "0.8"
# Must stay on the same major as `emusic-library`: only one crate in the
# dependency graph may link the native `sqlite3` library.
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "parsing"] }
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "signal",
    "sync",
    "time",
    "fs",
    "io-util",
] }
tokio-util = { version = "0.7", features = ["io"] }
toml = "1"
tower-http = { version = "0.6", features = ["trace", "limit"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }
uuid = { version = "1", features = ["v4"] }
walkdir = "2"

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
