[package]
name = "emusic-library"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[lib]
name = "emusic_library"
path = "src/lib.rs"

[dependencies]
emusic-core = { path = "../core" }
bass = { path = "../bass" }
dirs = "5"
dunce = "1"
lofty = "0.25"
notify = "8"
rayon = "1"
reqwest = { version = "0.12", features = ["json", "blocking"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
thiserror = "2"
tracing = "0.1"
walkdir = "2"
winshell = { path = "../winshell" }
