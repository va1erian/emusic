[package]
name = "emusic-frontend-portable"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
description = "emusic's portable frontend (xui_core): the cross-platform view layer over emusic-ui"
build = "build.rs"

[[bin]]
name = "emusic-portable-shot"
path = "src/bin/portable_shot.rs"
required-features = ["shot"]

[dependencies]
anyhow = "1"
emusic-platform = { path = "../platform" }
emusic-player = { path = "../player" }
emusic-ui = { path = "../ui" }
rfd = { version = "0.15", default-features = false }
tracing = "0.1"
clap = { version = "4", features = ["derive"], optional = true }
png = { version = "0.18", optional = true }
# The umbrella crate. Only its software `canvas` backend is used; the app
# imports portable widgets from `xui::xui_core::widget` and names the backend
# only in `run`.
xui = { git = "https://github.com/va1erian/xui", rev = "6d7bb7ca98073df049b41092dc5953570ab8dc7e", default-features = false, features = ["canvas"] }

[target.'cfg(windows)'.dependencies]
# File associations are a Windows shell feature; the settings page reaches for
# the registry helpers directly.
winshell = { path = "../winshell" }

[features]
# The headless canvas screenshot tool (`emusic-portable-shot`, #459). Off by
# default so the PNG encoder and `clap` never enter the real `emusic`
# dependency tree.
shot = ["dep:png", "dep:clap"]

[build-dependencies]
embed-resource = "3.0"

[dev-dependencies]
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(windows)'.dev-dependencies]
# Test-only: `xui`'s native win32 backend, used by the `#[cfg(windows)]` tests
# and test-only modules as a live-window host that a `#[test]` thread can
# create (the shipped `canvas` backend's winit event loop must be built on the
# process's main thread, which the test harness does not provide). Dropped
# from the shipped binary itself in #470; a dev-dependency never links into
# `cargo build`'s output.
xui = { git = "https://github.com/va1erian/xui", rev = "6d7bb7ca98073df049b41092dc5953570ab8dc7e", default-features = false, features = ["d2d"] }
