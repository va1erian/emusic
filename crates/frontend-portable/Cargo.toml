[package]
name = "emusic-frontend-portable"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "emusic's portable frontend (xui_core widgets): the view layer over emusic-ui"

[dependencies]
anyhow = "1"
emusic-platform = { path = "../platform" }
emusic-player = { path = "../player" }
emusic-ui = { path = "../ui" }
rfd = { version = "0.15", default-features = false }
tracing = "0.1"

# The portable frontend runs on the Win32 backend on Windows and the
# software/canvas backend elsewhere; only the backend feature differs.
[target.'cfg(windows)'.dependencies]
xui = { git = "https://github.com/va1erian/xui", rev = "1f5a60d2ab3c77992fb417d43a38cef3752b05ed", default-features = false, features = ["win32"] }
winshell = { path = "../winshell" }

[target.'cfg(not(windows))'.dependencies]
xui = { git = "https://github.com/va1erian/xui", rev = "1f5a60d2ab3c77992fb417d43a38cef3752b05ed", default-features = false, features = ["canvas"] }

[features]
default = []
# Windows dev/compare: build the software backend too and pick it with
# `XUI_BACKEND=canvas`, mirroring `xui`'s own gallery.
canvas = ["xui/canvas"]
