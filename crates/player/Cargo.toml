[package]
name = "emusic-player"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Playback engine (queue, transport, repeat/shuffle, listen accounting) on top of the bass crate"

[lib]
name = "emusic_player"
path = "src/lib.rs"

[dependencies]
bass = { path = "../bass" }
emusic-sid = { path = "../sid" }
thiserror = "2"
crossbeam-channel = "0.5"
rand = "0.8"
reqwest = { version = "0.12", features = ["blocking"] }
sha2 = "0.10"
hex = "0.4"
dirs = "5"
serde = { version = "1", features = ["derive"] }
tracing = "0.1"

[dev-dependencies]
toml = "1"
