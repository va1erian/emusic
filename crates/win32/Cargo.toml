[package]
name = "emusic-win32"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Native Win32 frontend for emusic, built on win32ui"
build = "build.rs"

[[bin]]
name = "emusic-win32"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
emusic-ui = { path = "../ui" }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
win32ui = { git = "https://github.com/va1erian/win32ui", branch = "main" }
winshell = { path = "../winshell" }

[build-dependencies]
embed-resource = "3.0"
