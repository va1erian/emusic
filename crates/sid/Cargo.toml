[package]
name = "emusic-sid"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Safe Rust API over the vendored cRSID Commodore 64 SID engine"

[lib]
name = "emusic_sid"
path = "src/lib.rs"

[features]
default = ["engine"]
# The vendored cRSID engine (C, needs GCC nested functions). Off, the crate is
# only the pure-Rust header and Songlengths parsers, for targets with no GCC
# (a zig/clang musl build).
engine = []

[dependencies]
md-5 = "0.10"
thiserror = "2"

[build-dependencies]
cc = "1"
