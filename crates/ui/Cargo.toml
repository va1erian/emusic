[package]
name = "emusic-ui"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Toolkit-agnostic UI logic for emusic: APIs, backends, mock data, view models"

[dependencies]
anyhow = "1"
bass = { path = "../bass" }
bitflags = "2"
clap = { version = "4", features = ["derive"] }
dirs = "5"
emusic-client = { path = "../client" }
emusic-core = { path = "../core" }
emusic-library = { path = "../library" }
emusic-metadata = { path = "../metadata" }
emusic-player = { path = "../player" }
emusic-search = { path = "../search" }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
lofty = "0.25"
rand = "0.8"
rand_chacha = "0.3"
rfd = { version = "0.15", default-features = false }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
toml = "1"
tracing = "0.1"
winshell = { path = "../winshell" }
