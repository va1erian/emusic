[package]
name = "emusic-ui"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Toolkit-agnostic UI logic for emusic: APIs, backends, mock data, view models"

[dependencies]
anyhow = "1"
bass = { path = "../bass" }
clap = { version = "4", features = ["derive"] }
emusic-core = { path = "../core" }
emusic-library = { path = "../library" }
emusic-player = { path = "../player" }
emusic-search = { path = "../search" }
rand = "0.8"
rand_chacha = "0.3"
rfd = { version = "0.15", default-features = false }
serde = { version = "1", features = ["derive"] }
tracing = "0.1"
winshell = { path = "../winshell" }
