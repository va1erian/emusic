[package]
name = "emusic"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[[bin]]
name = "emusic"
path = "src/main.rs"

[[bin]]
name = "emusic-shot"
path = "src/bin/emusic_shot.rs"
required-features = ["shot"]

[dependencies]
eframe = { version = "0.36", default-features = false, features = ["glow", "default_fonts", "accesskit"] }
egui_extras = "0.36"
emusic-player = { path = "../player" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "1"
dirs = "5"
thiserror = "2"
anyhow = "1"
rand = "0.8"
rand_chacha = "0.3"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
lofty = "0.22"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
egui_kittest = { version = "0.36", features = ["eframe", "wgpu", "snapshot"], optional = true }
bass = { path = "../bass" }
emusic-core = { path = "../core" }
emusic-library = { path = "../library" }
rfd = { version = "0.15", default-features = false }
winshell = { path = "../winshell" }

[features]
shot = ["dep:egui_kittest"]

[dev-dependencies]
egui_kittest = { version = "0.36", features = ["eframe", "wgpu", "snapshot"] }
