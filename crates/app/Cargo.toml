[package]
name = "emusic"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "emusic: music player and library, portable xui_core UI on xui"
build = "build.rs"

[[bin]]
name = "emusic"
path = "src/main.rs"

[[bin]]
name = "emusic-shot"
path = "src/bin/emusic_shot.rs"
required-features = ["shot"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
emusic-platform = { path = "../platform" }
emusic-ui = { path = "../ui" }
png = { version = "0.18", optional = true }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(windows)'.dependencies]
# The umbrella crate. On Windows its default `win32` feature re-exports the
# `xui-win32` backend, but the app imports portable widgets from
# `xui::xui_core::widget` and names the backend only in `main`.
xui = { git = "https://github.com/va1erian/xui", rev = "74010826e3c2f0c2835aaf58886079a5cc209494", default-features = false, features = ["win32"] }
# Declared directly (optional) only so the `shot` feature can turn on its
# `wgc` (Windows.Graphics.Capture) feature and the screenshot tool can capture.
xui-win32 = { git = "https://github.com/va1erian/xui", rev = "74010826e3c2f0c2835aaf58886079a5cc209494", optional = true }
# Single-instance/IPC handshake and file associations are Windows-only app
# integration; the association helpers live in `emusic-platform`.
winshell = { path = "../winshell" }

[target.'cfg(not(windows))'.dependencies]
# The portable software backend, so the crate structure stays cross-platform.
xui = { git = "https://github.com/va1erian/xui", rev = "74010826e3c2f0c2835aaf58886079a5cc209494", default-features = false, features = ["canvas"] }

[dev-dependencies]
emusic-player = { path = "../player" }

[features]
default = []
# The screenshot tool (`emusic-shot`, #118). Off by default so the PNG encoder
# and the WinRT capture bindings never enter the real binary's dependency tree.
shot = ["dep:png", "dep:xui-win32", "xui-win32/wgc"]
# Windows dev/compare: build the software backend too and pick it with
# `XUI_BACKEND=canvas`, mirroring `xui`'s own gallery.
canvas = ["xui/canvas"]

[build-dependencies]
embed-resource = "3.0"
