[package]
name = "emusic"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[[bin]]
name = "emusic"
path = "src/main.rs"

[[bin]]
name = "emusic-shot"
path = "src/bin/emusic_shot.rs"
required-features = ["shot"]

[dependencies]
eframe = { version = "0.36", default-features = false, features = ["glow", "default_fonts", "accesskit"] }
clap = { version = "4", features = ["derive"] }
rand = "0.8"
rand_chacha = "0.3"
egui_kittest = { version = "0.36", features = ["eframe", "wgpu", "snapshot"], optional = true }

[features]
shot = ["dep:egui_kittest"]

[dev-dependencies]
egui_kittest = { version = "0.36", features = ["eframe", "wgpu", "snapshot"] }
