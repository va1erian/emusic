[package]
name = "emusic"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "emusic: Windows music player and library, native Win32 UI on win32ui"
build = "build.rs"

[[bin]]
name = "emusic"
path = "src/main.rs"

[[bin]]
name = "emusic-shot"
path = "src/bin/emusic_shot.rs"
required-features = ["shot"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
emusic-milkdrop = { path = "../milkdrop" }
emusic-player = { path = "../player" }
emusic-projectm = { path = "../projectm" }
emusic-ui = { path = "../ui" }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
rfd = { version = "0.15", default-features = false }
png = { version = "0.18", optional = true }
souvlaki = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
win32ui = { git = "https://github.com/va1erian/win32ui", branch = "main" }
winshell = { path = "../winshell" }

[features]
# The headless screenshot tool (`emusic-shot`, #118). Off by default so the
# PNG encoder and the WinRT capture bindings never enter the real binary's
# dependency tree.
shot = ["dep:png", "win32ui/wgc"]

[build-dependencies]
embed-resource = "3.0"
