[package]
name = "emusic-metadata"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Online metadata lookup (MusicBrainz) for emusic's auto-tagging"

[lib]
name = "emusic_metadata"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
# Blocking HTTP + rustls. Lookups always run on the caller's worker thread, so
# no async runtime is needed; ureq is much lighter than reqwest here.
ureq = "3"
