[package]
name = "emusic-platform"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "OS shell integration for emusic: the portable ShellIntegration seam and its Windows implementation"

[dependencies]
# The portable xui core only: this crate never names a backend.
xui = { git = "https://github.com/va1erian/xui", rev = "51bded370a5174ab43a33be56991807ae5b2be93", default-features = false }
tracing = "0.1"

[target.'cfg(windows)'.dependencies]
# The Windows shell integrations live here and are compiled away elsewhere.
souvlaki = "0.8"
winshell = { path = "../winshell" }

[target.'cfg(target_os = "macos")'.dependencies]
# macOS uses the same `souvlaki` media-controls API for the Now Playing
# overlay and hardware media keys.
souvlaki = "0.8"
