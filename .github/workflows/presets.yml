name: Presets

# Packs the optional projectM preset packs into one .7z each, publishes them
# as assets on a `viz-presets-<yyyymmdd>` GitHub release, and refreshes the
# download URLs and SHA-256 hashes in installer/presets-archives.iss (#299).
#
# The preset bytes are never committed; only the generated hash file is (via
# the pull request this job opens, so the release installers can pick them up).
# Run this before tagging an emusic release that should offer the downloads.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish under (default: viz-presets-<today>)"
        required: false
        default: ""
      packs:
        description: "Space-separated pack folders (default: every optional pack)"
        required: false
        default: "all"

permissions:
  contents: write
  pull-requests: write

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Resolve release tag
        id: release
        shell: pwsh
        run: |
          $tag = "${{ github.event.inputs.tag }}"
          if (-not $tag) { $tag = "viz-presets-$(Get-Date -Format yyyyMMdd)" }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          Write-Host "Publishing preset archives under $tag"

      - name: Fetch, pack and hash the presets
        shell: pwsh
        run: |
          $packs = @("${{ github.event.inputs.packs }}" -split '\s+' | Where-Object { $_ })
          if ($packs.Count -eq 0) { $packs = @("all") }
          ./scripts/fetch-presets.ps1 -Pack $packs -ReleaseTag "${{ steps.release.outputs.tag }}"

      - name: Build the "get more presets" helper
        shell: pwsh
        run: |
          $iscc = Get-ChildItem "C:\Program Files*\Inno Setup*\ISCC.exe" -ErrorAction Stop | Select-Object -First 1
          & $iscc.FullName installer\emusic-presets.iss

      - name: Publish the archives and helper
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: Visualization presets ${{ steps.release.outputs.tag }}
          body: |
            Optional projectM preset packs for emusic (#299). Each archive is
            verified by SHA-256 by the installer before it is extracted; the
            hashes live in installer/presets-archives.iss.
          files: |
            target/presets/archives/*.7z
            installer/Output/emusic-presets-setup.exe

      - name: Open a pull request with the refreshed hashes
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git diff --quiet -- installer/presets-archives.iss
          if ($LASTEXITCODE -eq 0) {
            Write-Host "presets-archives.iss is unchanged; nothing to do."
            exit 0
          }
          Write-Host "presets-archives.iss changed; opening a pull request."
          $branch = "presets/${{ steps.release.outputs.tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b $branch
          git add installer/presets-archives.iss
          git commit -m "Refresh preset archive hashes (${{ steps.release.outputs.tag }})"
          git push -u origin $branch
          gh pr create --base main --head $branch `
            --title "Refresh preset archive hashes (${{ steps.release.outputs.tag }})" `
            --body "Generated by the Presets workflow from release ${{ steps.release.outputs.tag }}. Closes nothing; merge so the release installers offer the visualization preset downloads (#299)."
