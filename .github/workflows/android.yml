name: Android

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "crates/mobile/**"
      - "crates/client/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - "crates/mobile/**"
      - "crates/client/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  NDK_VERSION: "27.2.12479018"

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0" "ndk;$NDK_VERSION" "platform-tools"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2

      - run: cargo install cargo-ndk --locked

      - name: Build debug APK
        working-directory: android
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/${{ env.NDK_VERSION }}
        run: ./gradlew :app:assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: emusic-android-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  instrumentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0" "ndk;$NDK_VERSION" "platform-tools"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2

      - run: cargo install cargo-ndk --locked

      - name: Run instrumentation tests on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            export ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/$NDK_VERSION
            cd android
            ./gradlew :app:connectedDebugAndroidTest --no-daemon

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-instrumentation-reports
          path: android/app/build/reports/androidTests/
          if-no-files-found: ignore
