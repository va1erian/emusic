name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      client: ${{ steps.filter.outputs.client }}
      server: ${{ steps.filter.outputs.server }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            client:
              - 'crates/app/**'
              - 'crates/ui/**'
              - 'crates/bass/**'
              - 'crates/sid/**'
              - 'crates/winshell/**'
              - 'crates/metadata/**'
              - 'crates/search/**'
              - 'crates/milkdrop/**'
              - 'crates/projectm/**'
              - 'crates/win32ui-demo/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
            server:
              - 'crates/server/**'
              - 'crates/core/**'
              - 'crates/library/**'
              - 'Dockerfile'
              - 'docker-compose.yml'
              - 'Cargo.toml'
              - 'Cargo.lock'

  lint:
    needs: changes
    if: ${{ needs.changes.outputs.client == 'true' || github.ref == 'refs/heads/main' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          save-if: "true"

      - run: cargo fmt --all --check

      - run: cargo clippy --workspace --all-targets --features emusic/shot -- -D warnings

  test:
    needs: changes
    if: ${{ needs.changes.outputs.client == 'true' || github.ref == 'refs/heads/main' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          save-if: "true"

      - run: cargo test --workspace --features emusic/shot

  server-ci:
    needs: changes
    if: ${{ needs.changes.outputs.server == 'true' || github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - run: cargo clippy -p emusic-server -p emusic-core -p emusic-library -- -D warnings

      - run: cargo test -p emusic-server -p emusic-core -p emusic-library

  ci:
    if: ${{ always() }}
    needs: [changes, lint, test, server-ci]
    runs-on: ubuntu-latest
    steps:
      - name: Require lint, test and server-ci to succeed or skip
        run: |
          echo "lint=${{ needs.lint.result }} test=${{ needs.test.result }} server=${{ needs.server-ci.result }}"
          for res in "${{ needs.lint.result }}" "${{ needs.test.result }}" "${{ needs.server-ci.result }}"; do
            if [ "$res" != "success" ] && [ "$res" != "skipped" ]; then
              echo "Job failed: $res"
              exit 1
            fi
          done
