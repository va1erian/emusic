name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Lets a maintainer build the canvas artifact on demand from the Actions tab.
  workflow_dispatch:

# A new push to a PR branch cancels the previous run on that branch (#90):
# stale runs after a rebase were pure latency.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Incremental artifacts are large and useless in CI; rust-cache sets this
  # too, but making it explicit keeps the intent obvious (#90).
  CARGO_INCREMENTAL: "0"

jobs:
  # Formatting and lints. `clippy --all-targets` type-checks everything that
  # `cargo check --all-targets` would, so the separate `check` invocations the
  # old single job ran are redundant and were dropped (#90).
  #
  # `--features emusic/shot` adds the `emusic-shot` screenshot tool and its
  # optional `png`/WinRT capture dependencies, so one feature set covers both
  # the plain and the `shot` passes, without building the crate twice.
  lint:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          # Only repopulate the cache from main; PR runs restore it but never
          # pay for the (sometimes multi-minute) cache save.
          save-if: "true" # TEMP: populate caches from this PR branch for a warm measurement

      - run: cargo fmt --all --check

      - run: cargo clippy --workspace --all-targets --features emusic/shot -- -D warnings

  # Tests, including the `shot`-gated `emusic-shot` tool. Running only the
  # superset invocation keeps every test that `cargo test --workspace` ran and
  # avoids a second build with a different feature set.
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          save-if: "true" # TEMP: populate caches from this PR branch for a warm measurement

      - run: cargo test --workspace --features emusic/shot

  # macOS: the portable canvas backend, selected by default off Windows. GNU
  # GCC is required for the vendored cRSID engine, whose nested functions
  # Apple clang does not implement. The BASS/projectM dylibs are absent, so the
  # tests that need them skip gracefully.
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          save-if: "true"

      # cRSID's nested functions need GNU GCC; `crates/sid/build.rs` finds the
      # Homebrew one by name (Apple's `/usr/bin/gcc` is a clang shim).
      - name: Install GNU GCC (cRSID)
        run: brew install gcc

      - run: cargo fmt --all --check

      - run: cargo check --workspace --all-targets

      - run: cargo clippy --workspace --all-targets -- -D warnings

      - run: cargo test --workspace

      # Start the real shell on the portable backend against mock data and let
      # `EMUSIC_SMOKE_EXIT_MS` close it, so the run cannot hang CI.
      - name: Portable smoke run
        run: cargo run -p emusic --bin emusic -- --mock
        env:
          EMUSIC_SMOKE_EXIT_MS: "4000"

  # A portable Windows build with the software (canvas) backend compiled in
  # (#369), published as a standalone `emusic-canvas.exe` plus a launcher zip
  # that sets `XUI_BACKEND=canvas` — no installer. This is an artifact, not a
  # gate, so it is deliberately not part of the required `ci` check; download
  # it from the run's Artifacts section.
  canvas:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build the canvas executable
        run: cargo build --release -p emusic --features "portable,emusic-frontend-portable/canvas"

      - name: Stage the canvas executable
        shell: pwsh
        run: |
          $stage = "emusic-canvas"
          New-Item -ItemType Directory -Force $stage | Out-Null
          # A distinct name so it is never confused with the native win32
          # `emusic.exe`; both backends are in this binary, `XUI_BACKEND` picks.
          Copy-Item target/release/emusic.exe "$stage/emusic-canvas.exe"
          @(
            '@echo off',
            'rem Launch emusic on the portable canvas (software) backend.',
            'set XUI_BACKEND=canvas',
            'start "" "%~dp0emusic-canvas.exe" %*'
          ) | Set-Content "$stage/run-canvas.cmd" -Encoding ascii
          Compress-Archive -Path "$stage/*" -DestinationPath emusic-canvas-windows.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: emusic-canvas-windows
          path: |
            emusic-canvas-windows.zip
            emusic-canvas/emusic-canvas.exe
          if-no-files-found: error

  # Aggregator that preserves the branch-protection required check named
  # `ci`. It succeeds only if every gating job succeeded, so the required name
  # does not change while the work itself runs in parallel.
  ci:
    if: ${{ always() }}
    needs: [lint, test, macos]
    runs-on: ubuntu-latest
    steps:
      - name: Require lint, test and macos to succeed
        run: |
          echo "lint=${{ needs.lint.result }} test=${{ needs.test.result }} macos=${{ needs.macos.result }}"
          test "${{ needs.lint.result }}" = success
          test "${{ needs.test.result }}" = success
          test "${{ needs.macos.result }}" = success
