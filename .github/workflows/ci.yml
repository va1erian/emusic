name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to a PR branch cancels the previous run on that branch (#90):
# stale runs after a rebase were pure latency.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Incremental artifacts are large and useless in CI; rust-cache sets this
  # too, but making it explicit keeps the intent obvious (#90).
  CARGO_INCREMENTAL: "0"

jobs:
  # Formatting and lints. `clippy --all-targets` type-checks everything that
  # `cargo check --all-targets` would, so the separate `check` invocations the
  # old single job ran are redundant and were dropped (#90).
  #
  # `--features emusic/shot` adds the `emusic-shot` screenshot tool and its
  # optional `png`/WinRT capture dependencies, so one feature set covers both
  # the plain and the `shot` passes, without building the crate twice.
  lint:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          # Only repopulate the cache from main; PR runs restore it but never
          # pay for the (sometimes multi-minute) cache save.
          save-if: "true" # TEMP: populate caches from this PR branch for a warm measurement

      - run: cargo fmt --all --check

      - run: cargo clippy --workspace --all-targets --features emusic/shot -- -D warnings

  # Tests, including the `shot`-gated `emusic-shot` tool. Running only the
  # superset invocation keeps every test that `cargo test --workspace` ran and
  # avoids a second build with a different feature set.
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          save-if: "true" # TEMP: populate caches from this PR branch for a warm measurement

      - run: cargo test --workspace --features emusic/shot

  # macOS: the portable canvas backend, from the same codebase (macOS port,
  # wiki). GNU GCC is required for the vendored cRSID engine, whose nested
  # functions Apple clang does not implement. The BASS/projectM dylibs are
  # absent, so the tests that need them skip gracefully.
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          save-if: "true"

      - name: Install GNU GCC (cRSID)
        run: brew install gcc

      - run: cargo fmt --all --check

      - run: cargo check --workspace --all-targets

      - run: cargo clippy --workspace --all-targets -- -D warnings

      - run: cargo test --workspace

      # Start the real shell on the canvas backend against mock data and let
      # `EMUSIC_SMOKE_EXIT_MS` close it, so the run cannot hang CI.
      - name: Canvas smoke run
        run: cargo run -p emusic --features canvas --bin emusic -- --mock
        env:
          EMUSIC_SMOKE_EXIT_MS: "4000"

  # Aggregator that preserves the branch-protection required check named
  # `ci`. It succeeds only if every job succeeded, so the required name does
  # not change while the work itself runs in parallel.
  ci:
    if: ${{ always() }}
    needs: [lint, test, macos]
    runs-on: ubuntu-latest
    steps:
      - name: Require lint, test and macos to succeed
        run: |
          echo "lint=${{ needs.lint.result }} test=${{ needs.test.result }} macos=${{ needs.macos.result }}"
          test "${{ needs.lint.result }}" = success
          test "${{ needs.test.result }}" = success
          test "${{ needs.macos.result }}" = success
