name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --all --check

      - run: cargo check --workspace --all-targets

      - run: cargo clippy --workspace --all-targets -- -D warnings

      - run: cargo test --workspace

      # `shot` (the emusic-shot screenshot binary + its egui_kittest
      # snapshot tests) is gated behind a feature so egui_kittest/wgpu stay
      # out of the default build; check/test it explicitly too. Snapshot
      # tests themselves skip gracefully if this runner has no headless GPU
      # adapter (see crates/app/tests/snapshot_views.rs).
      - run: cargo check --workspace --all-targets --features emusic/shot

      - run: cargo clippy --workspace --all-targets --features emusic/shot -- -D warnings

      - run: cargo test --workspace --features emusic/shot
