name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to a PR branch cancels the previous run on that branch (#90):
# stale runs after a rebase were pure latency.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Incremental artifacts are large and useless in CI; rust-cache sets this
  # too, but making it explicit keeps the intent obvious (#90).
  CARGO_INCREMENTAL: "0"

jobs:
  # Formatting and lints. `clippy --all-targets` type-checks everything that
  # `cargo check --all-targets` would, so the separate `check` invocations the
  # old single job ran are redundant and were dropped (#90).
  #
  # `--features emusic/shot` is used for *every* CI invocation: the feature is
  # a strict superset (it only adds the `emusic-shot` binary and its optional
  # egui_kittest dependency; the integration tests already get egui_kittest
  # through dev-dependencies), so one feature set covers both the plain and
  # the `shot` passes, without building the whole `emusic` crate twice.
  lint:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          # Only repopulate the cache from main; PR runs restore it but never
          # pay for the (sometimes multi-minute) cache save.
          save-if: "true" # TEMP: populate caches from this PR branch for a warm measurement

      - run: cargo fmt --all --check

      - run: cargo clippy --workspace --all-targets --features emusic/shot -- -D warnings

  # Tests, including the `shot`-gated snapshot tests. Running only the
  # superset invocation keeps every test that `cargo test --workspace` ran
  # (same lib/bin/integration tests, plus the `emusic-shot` target) while
  # avoiding a second `emusic` build with a different feature set.
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          save-if: "true" # TEMP: populate caches from this PR branch for a warm measurement

      - run: cargo test --workspace --features emusic/shot

  # Aggregator that preserves the branch-protection required check named
  # `ci`. It succeeds only if both `lint` and `test` succeeded, so the
  # required name does not change while the work itself runs in parallel.
  ci:
    if: ${{ always() }}
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - name: Require lint and test to succeed
        run: |
          echo "lint=${{ needs.lint.result }} test=${{ needs.test.result }}"
          test "${{ needs.lint.result }}" = success
          test "${{ needs.test.result }}" = success
