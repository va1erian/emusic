name: Server image

# Builds the emusic-server container image and pushes it to the GitHub
# Container Registry (ghcr.io/<owner>/emusic-server). Pushes happen for the
# default branch, version tags and manual runs; pull requests build the image
# without pushing so a broken Dockerfile is caught before merge.

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "crates/server/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "deploy/Dockerfile"
      - ".github/workflows/server-image.yml"
  pull_request:
    paths:
      - "crates/server/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "deploy/Dockerfile"
      - ".github/workflows/server-image.yml"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/emusic-server

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to the container registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
