name: Release

# Builds the installer and a portable zip and attaches both assets to a GitHub
# Release whenever a `v*` tag is pushed (#240). BASS is never committed to the
# repo (see docs/installer.md); this workflow downloads the redistributable x64
# DLLs from un4seen at build time, the same set the README lists under
# "BASS DLLs".
on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

permissions:
  contents: write

jobs:
  # libprojectM/GLEW runtime DLLs (#298): built and cached by the reusable
  # workflow, then staged next to the exe where the installer's default
  # ProjectMDir (`<BuildDir>\projectm`) looks for them.
  projectm:
    uses: ./.github/workflows/projectm.yml

  release:
    needs: projectm
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # After rust-cache, so its target-dir cleanup cannot touch the DLLs.
      - name: Download projectM DLLs
        uses: actions/download-artifact@v4
        with:
          name: projectm-dlls
          path: target/release/projectm

      # The tag is the source of truth for the version (#188): stamp it into
      # the crate manifest (shown in About) and the installer script (#240).
      - name: Stamp version from tag
        shell: bash
        run: |
          set -eu
          version="${GITHUB_REF_NAME#v}"
          # Cargo only accepts a semver version, so a test tag like `v9.9.9.9`
          # must not be written into Cargo.toml or the whole release fails to
          # build. The installer's version is free-form, so it is always stamped.
          if [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+].*)?$ ]]; then
            sed -i "0,/^version = \".*\"/s//version = \"$version\"/" crates/app/Cargo.toml
            cargo update -p emusic --offline || true
          else
            echo "::warning title=Non-semver tag::tag $GITHUB_REF_NAME is not semver; leaving the crate version unchanged"
          fi
          sed -i "s/^#define AppVersion \".*\"/#define AppVersion \"$version\"/" installer/emusic.iss
          sed -i "s/^VersionInfoVersion=.*/VersionInfoVersion=${version%%[-+]*}.0/" installer/emusic.iss

      - run: cargo build --release --workspace

      # Redistributable x64 BASS DLLs (free for non-commercial use), fetched
      # fresh each release instead of being committed to git (#124).
      - name: Download BASS DLLs
        shell: bash
        run: |
          set -eu
          mkdir -p target/release/bass
          for pkg in bass24 bassflac24 bassopus24 bassmidi24; do
            curl -sSfL -o "$pkg.zip" "https://www.un4seen.com/files/$pkg.zip"
            7z e -y "$pkg.zip" -o"target/release/bass" "x64/*.dll"
          done
          ls target/release/bass

      # Chocolatey's `innosetup` package only ships Inno Setup 6, but the
      # script requires 7 (SetupArchitecture); install the real thing
      # unattended from its GitHub release instead.
      - name: Install Inno Setup 7
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/jrsoftware/issrc/releases/download/is-7_1_0/innosetup-7.1.0-x64.exe" -OutFile innosetup.exe
          Start-Process -FilePath .\innosetup.exe -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait

      # Bundled visualization presets and the stand-alone "get more presets"
      # helper (#299): the base set is fetched (never committed) and the helper
      # must exist before emusic.iss so it can bundle it into {app}.
      - name: Prepare visualization presets
        shell: pwsh
        run: |
          ./scripts/fetch-presets.ps1 -Pack milkdrop-original,textures -NoArchive -NoUpdate
          $iscc = Get-ChildItem "C:\Program Files*\Inno Setup*\ISCC.exe" -ErrorAction Stop | Select-Object -First 1
          & $iscc.FullName installer\emusic-presets.iss

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = Get-ChildItem "C:\Program Files*\Inno Setup*\ISCC.exe" -ErrorAction Stop | Select-Object -First 1
          & $iscc.FullName installer\emusic.iss

      # Portable zip with the same bass/icons/projectm payload.
      - name: Package portable zip
        shell: bash
        run: |
          set -eu
          version="${GITHUB_REF_NAME#v}"
          stage="emusic-portable"
          mkdir -p "$stage/bass" "$stage/icons" "$stage/projectm"
          cp target/release/emusic.exe "$stage/"
          cp target/release/bass/*.dll "$stage/bass/"
          cp assets/ico/*.ico "$stage/icons/"
          # libprojectM + GLEW runtime and their LGPL-2.1 text (#298).
          cp target/release/projectm/*.dll "$stage/projectm/"
          cp COPYING-LGPL-2.1.txt "$stage/projectm/"
          7z a "emusic-$version-portable.zip" "$stage"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # The projectM/GLEW runtime as standalone downloads (#298), so the DLLs
          # the app loads can be inspected or replaced without the installer;
          # the LGPL-2.1 text ships alongside them.
          files: |
            installer/Output/emusic-*-setup.exe
            emusic-*-portable.zip
            target/release/projectm/*.dll
            COPYING-LGPL-2.1.txt
          generate_release_notes: true
